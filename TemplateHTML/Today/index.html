<script>
(() => {
  const $ = s => document.querySelector(s);
  const money = n => `${Math.round(n).toLocaleString('vi-VN')} ₫`;
  const num = n => Math.round(n).toLocaleString('vi-VN');
  const icon = (name,cls='sm') => `<svg class="icon ${cls}"><use href="#i-${name}"/></svg>`;
  const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const baseDate = '2024-12-16';
  const hourly = [
    {h:6,amount:100000,orders:2,units:9},{h:7,amount:180000,orders:2,units:11},{h:8,amount:340000,orders:3,units:16},{h:9,amount:420000,orders:4,units:22},{h:10,amount:650000,orders:5,units:33},{h:11,amount:500000,orders:4,units:28},{h:12,amount:360000,orders:4,units:19},{h:13,amount:220000,orders:3,units:13},{h:14,amount:80000,orders:1,units:5},
    {h:15,amount:280000,orders:3,units:15},{h:16,amount:480000,orders:5,units:24},{h:17,amount:420000,orders:4,units:21},{h:18,amount:300000,orders:3,units:16},
    {h:19,amount:220000,orders:2,units:10},{h:20,amount:240000,orders:3,units:12},{h:21,amount:170000,orders:2,units:8},{h:22,amount:100000,orders:1,units:5}
  ];
  const categories = [{name:'Đồ uống',pct:35,color:'#009567'},{name:'Bánh kẹo',pct:22,color:'#348cff'},{name:'Gia vị',pct:15,color:'#ffa01e'},{name:'Sữa và TP từ sữa',pct:12,color:'#8548cb'},{name:'Đồ gia dụng',pct:8,color:'#fb617e'},{name:'Khác',pct:8,color:'#a9b2c3'}];
  const products=[
    {name:'Coca Cola 330ml',sku:'SP0001',unit:'Lon',qty:48,total:480000,pack:'cola',short:'Coca<br>Cola'},
    {name:'Mì Hảo Hảo 75g',sku:'SP0007',unit:'Gói',qty:36,total:144000,pack:'noodle',short:'Hảo Hảo'},
    {name:'Nước suối Aquafina 500ml',sku:'SP0003',unit:'Chai',qty:32,total:224000,pack:'water',short:'Aqua'},
    {name:'Sữa Vinamilk 180ml',sku:'SP0005',unit:'Hộp',qty:28,total:224000,pack:'milk',short:'VNM'},
    {name:'Bánh Oreo 133g',sku:'SP0006',unit:'Gói',qty:24,total:528000,pack:'cookie',short:'OREO'},
    {name:'Dầu ăn Tường An 1L',sku:'SP0012',unit:'Chai',qty:14,total:588000,pack:'water',short:'Dầu'},
    {name:'Nước mắm Nam Ngư 500ml',sku:'SP0014',unit:'Chai',qty:11,total:242000,pack:'cola',short:'Nam Ngư'}
  ];
  const morningTx=[
    {id:'#HD000123',time:'14:23',items:3,amount:120000,payment:'Tiền mặt'},
    {id:'#HD000122',time:'14:15',items:5,amount:250000,payment:'Chuyển khoản'},
    {id:'#HD000121',time:'13:58',items:2,amount:75000,payment:'Tiền mặt'},
    {id:'#HD000120',time:'13:42',items:6,amount:320000,payment:'Công nợ'},
    {id:'#HD000119',time:'13:30',items:1,amount:90000,payment:'Tiền mặt'}
  ];
  const extraTx=[
    {id:'#HD000140',time:'22:14',items:4,amount:100000,payment:'Tiền mặt',shift:'evening'},
    {id:'#HD000139',time:'21:40',items:3,amount:170000,payment:'Chuyển khoản',shift:'evening'},
    {id:'#HD000138',time:'20:17',items:5,amount:240000,payment:'Tiền mặt',shift:'evening'},
    {id:'#HD000137',time:'18:52',items:6,amount:300000,payment:'Công nợ',shift:'afternoon'},
    {id:'#HD000136',time:'17:23',items:3,amount:420000,payment:'Chuyển khoản',shift:'afternoon'},
    {id:'#HD000135',time:'16:45',items:4,amount:480000,payment:'Tiền mặt',shift:'afternoon'},
    {id:'#HD000134',time:'15:12',items:2,amount:280000,payment:'Tiền mặt',shift:'afternoon'}
  ];
  const state={date:baseDate,shift:'morning',metric:'revenue',category:null,drawer:null,closed:false,selectedBar:null};
  function dateObj(){return new Date(`${state.date}T12:00:00`)}
  function formatDate(d){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
  function dayOffset(){return Math.round((dateObj()-new Date(`${baseDate}T12:00:00`))/86400000)}
  function factor(){let o=dayOffset();return o===0?1:Math.max(.68,Math.min(1.28,1+(((o*37)%17)-8)/60))}
  function shiftHours(){return hourly.filter(x=>state.shift==='all'||(state.shift==='morning'?x.h<15:state.shift==='afternoon'?x.h>=15&&x.h<19:x.h>=19))}
  function totals(){const f=factor();const rows=shiftHours();return {revenue:Math.round(rows.reduce((a,x)=>a+x.amount,0)*f/1000)*1000,invoices:Math.round(rows.reduce((a,x)=>a+x.orders,0)*f),units:Math.round(rows.reduce((a,x)=>a+x.units,0)*f),profit:Math.round(rows.reduce((a,x)=>a+x.amount,0)*f*820/2850/1000)*1000}}
  function txRows(){let items=state.shift==='morning'?morningTx:state.shift==='all'?[...extraTx,...morningTx]:extraTx.filter(x=>x.shift===state.shift);return items.map(x=>({...x,amount:Math.round(x.amount*factor()/1000)*1000}))}
  function renderHeader(){const d=dateObj();const isBase=state.date===baseDate;$('#dateLabel').textContent=`${isBase?'Hôm nay, ':''}${formatDate(d)}`;$('#dateInput').value=state.date;const weekdays=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];const range={morning:'00:00 – 14:23',afternoon:'15:00 – 18:59',evening:'19:00 – 22:59',all:'00:00 – 22:59'}[state.shift];$('#subtitle').innerHTML=`${weekdays[d.getDay()]}, ${formatDate(d)}&nbsp; (${range}) ${icon('info')}`;$('#storeStatus').classList.toggle('closed',state.closed);$('#storeStatus').setAttribute('aria-pressed',String(!state.closed));$('#statusText').textContent=state.closed?'Đã đóng cửa':'Đang mở cửa'}
  function renderKpis(){const t=totals();$('#revenueKpi').textContent=money(t.revenue);$('#invoiceKpi').textContent=num(t.invoices);$('#unitKpi').textContent=num(t.units);$('#profitKpi').textContent=money(t.profit)}
  function chartValue(row){const f=factor();return state.metric==='revenue'?Math.round(row.amount*f/1000)*1000:Math.round(row[state.metric==='invoices'?'orders':'units']*f)}
  function renderChart(){const rows=shiftHours();const values=rows.map(chartValue);const max=Math.max(...values,1);const top=state.metric==='revenue'?Math.ceil(max/200000)*200000:Math.ceil(max/10)*10;const formatTick=v=>state.metric==='revenue'?`${Math.round(v/1000)}K`:String(Math.round(v));$('#yAxis').innerHTML=[top,top*.75,top*.5,top*.25,0].map(formatTick).join('<br>');$('#yAxis').innerHTML=[top,top*.75,top*.5,top*.25,0].map(x=>`<span>${formatTick(x)}</span>`).join('');$('#chartBars').innerHTML=rows.map((row,i)=>`<button class="bar${state.selectedBar===row.h?' selected':''}" style="--bar-height:${Math.max(1,values[i]/top*100)}%" data-hour="${row.h}" aria-label="${row.h}:00, ${state.metric==='revenue'?money(values[i]):num(values[i])}"><span class="bar-tip">${row.h}:00 · ${state.metric==='revenue'?money(values[i]):num(values[i])}</span></button>`).join('');$('#xAxis').innerHTML=rows.map((row,i)=>`<span>${(rows.length<=9||i%2===0)?row.h+'h':''}</span>`).join('')}
  function renderDonut(){const t=totals();const sel=categories.find(x=>x.name===state.category);$('#donutValue').textContent=money(sel?Math.round(t.revenue*sel.pct/100):t.revenue);$('#donutCaption').textContent=sel?sel.name:'Tổng doanh thu';$('#donut').style.filter=sel?'drop-shadow(0 3px 7px #1a375e22)':'';$('#legend').innerHTML=categories.map(c=>`<button class="legend-item${state.category===c.name?' selected':''}" data-category="${escapeHtml(c.name)}"><span class="swatch" style="background:${c.color}"></span><span class="legend-name">${escapeHtml(c.name)}</span><span class="legend-pct">${c.pct}%</span></button>`).join('')}
  function renderProducts(){const scale=totals().revenue/2850000;$('#productsList').innerHTML=products.slice(0,5).map((p,i)=>`<button class="product-row" data-product="${i}"><span class="rank ${i<3?'top':''}">${i+1}</span><span class="product-pack ${p.pack}">${p.short}</span><span class="product-copy"><span class="product-name">${p.name}</span><span class="product-meta">${p.sku} | ${p.unit}</span></span><span class="product-qty">${num(p.qty*scale)}</span><span class="product-total">${money(p.total*scale)}</span></button>`).join('')}
  function paymentClass(p){return p==='Tiền mặt'?'cash':p==='Công nợ'?'debt':'transfer'}
  function paymentIcon(p){return p==='Tiền mặt'?'money':p==='Công nợ'?'bank':'bank'}
  function renderTransactions(){const rows=txRows().slice(0,5);$('#transactionsList').innerHTML=rows.map((t,i)=>`<button class="txn-row" data-tx="${i}"><span class="txn-icon">${icon('money')}</span><span><span class="txn-top"><strong>${t.id}</strong><span class="txn-time">${t.time}</span></span><span class="txn-meta">${t.items} sản phẩm</span></span><span class="txn-right"><span class="txn-amount">${money(t.amount)}</span><span class="payment ${paymentClass(t.payment)}">${icon(paymentIcon(t.payment))}${t.payment}</span></span></button>`).join('')}
  function renderStock(){const stock=[['Sắp hết hàng','8 sản phẩm','alert',''],['Hết hàng','3 sản phẩm','bag','red'],['Tồn kho thấp','12 sản phẩm','alert',''],['Tồn kho bình thường','342 sản phẩm','check','green']];$('#stockList').innerHTML=stock.map((s,i)=>`<button class="stock-row" data-stock="${i}"><span class="stock-dot ${s[3]}">${icon(s[2])}</span><span>${s[0]}</span><span class="stock-count">${s[1]}</span>${icon('chevron')}</button>`).join('')}
  function renderDebt(){const amount=Math.round(1250000*factor()/1000)*1000;$('#debtBody').innerHTML=`<div class="debt-line"><span>Tổng công nợ</span><strong>${money(amount)}</strong></div><div class="debt-line"><span>Số khách còn nợ</span><strong>5</strong></div><div class="debt-line overdue"><span>Quá hạn</span><strong>2 khách</strong></div>`}
  function render(){renderHeader();renderKpis();renderChart();renderDonut();renderProducts();renderTransactions();renderStock();renderDebt();if(state.drawer)openDrawer(state.drawer,false)}
  const card=(symbol,title,body,kind='')=>`<section class="explain-card"><div class="explain-head"><span class="explain-icon ${kind}">${icon(symbol)}</span><span>${title}</span></div>${body}</section>`;
  function explainRevenue(){const t=totals();const d=formatDate(dateObj());const range={morning:'00:00 đến 14:23',afternoon:'15:00 đến 18:59',evening:'19:00 đến 22:59',all:'00:00 đến 22:59'}[state.shift];return [
    card('receipt','1. Định nghĩa','<p>Doanh thu là tổng giá trị các giao dịch bán hàng đã hoàn tất trong khoảng thời gian đã chọn.</p>'),
    card('register','2. Công thức','<div class="formula">Doanh thu = Tổng giá trị Sale hoàn tất<br>− Giá trị Return<br>− Giá trị Sale bị Void</div>'),
    card('calendar','3. Phạm vi thời gian',`<p>Từ ${range}, ngày ${d} (theo múi giờ của cửa hàng).</p>`,'blue'),
    card('check','4. Bao gồm','<ul><li>Tất cả giao dịch bán hàng đã hoàn tất.</li><li>Bao gồm cả tiền mặt, chuyển khoản và công nợ.</li></ul>'),
    card('close','5. Không bao gồm','<ul><li>Đơn chưa hoàn tất (đơn đang giữ).</li><li>Giao dịch bị hủy (Void).</li><li>Các điều chỉnh thủ công không phải bán hàng (nếu có).</li></ul>','red'),
    card('list','6. Xem chi tiết',`<p>Bạn có thể xem danh sách các giao dịch cấu thành doanh thu ${money(t.revenue)}.</p><button class="drawer-action" data-open="transactions">${icon('list')} Xem giao dịch trong ca</button>`,'blue'),
    `<div class="notice">${icon('info')}<span><strong>Lưu ý</strong><br>Số liệu có thể thay đổi nếu có giao dịch được hoàn tất, return hoặc hủy trong ngày.</span></div>`
  ].join('')}
  function detailsFor(type){const t=totals(), f=totals().revenue/2850000;
    if(type==='revenue')return {title:'Cách tính doanh thu',body:explainRevenue()};
    if(type==='transactions'){let rows=txRows();return {title:'Giao dịch gần đây',body:`<p class="detail-intro">${formatDate(dateObj())} · ${$('#shiftSelect').selectedOptions[0].textContent}. Chọn giao dịch để xem chi tiết.</p><div class="detail-list">${rows.map((x,i)=>`<button class="detail-item" data-txdetail="${i}"><strong>${x.id} · ${money(x.amount)}</strong><span>${x.time} · ${x.items} sản phẩm · ${x.payment}</span></button>`).join('')}</div>`}};
    if(type.startsWith('transaction:')){let x=txRows()[Number(type.split(':')[1])];if(!x)return detailsFor('transactions');return {title:'Chi tiết giao dịch',body:`<div class="detail-card"><h3>${x.id}</h3><div class="detail-grid"><span>Thời gian</span><strong>${formatDate(dateObj())} · ${x.time}</strong><span>Trạng thái</span><strong>Hoàn tất</strong><span>Số sản phẩm</span><strong>${x.items}</strong><span>Thanh toán</span><strong>${x.payment}</strong><span>Giá trị</span><strong>${money(x.amount)}</strong></div></div><button class="drawer-action" data-open="transactions">${icon('left')} Quay lại danh sách</button>`}};
    if(type==='products'){return {title:'Sản phẩm bán chạy',body:`<p class="detail-intro">Xếp hạng theo số lượng bán trong thời gian đã chọn.</p><div class="detail-list">${products.map((p,i)=>`<button class="detail-item" data-productdetail="${i}"><strong>${i+1}. ${p.name}</strong><span>${p.sku} · ${num(p.qty*f)} ${p.unit.toLowerCase()} · ${money(p.total*f)}</span></button>`).join('')}</div>`}};
    if(type.startsWith('product:')){let p=products[Number(type.split(':')[1])];if(!p)return detailsFor('products');return {title:'Chi tiết sản phẩm',body:`<div class="detail-card"><h3>${p.name}</h3><div class="detail-grid"><span>Mã sản phẩm</span><strong>${p.sku}</strong><span>Đơn vị</span><strong>${p.unit}</strong><span>Số lượng bán</span><strong>${num(p.qty*f)}</strong><span>Doanh thu</span><strong>${money(p.total*f)}</strong></div></div><button class="drawer-action" data-open="products">${icon('left')} Quay lại xếp hạng</button>`}};
    if(type==='stock'||type.startsWith('stock:')){const rows=[['Sắp hết hàng','8 sản phẩm','Sản phẩm dự kiến hết trong vài ngày tới.'],['Hết hàng','3 sản phẩm','Số lượng khả dụng bằng 0.'],['Tồn kho thấp','12 sản phẩm','Số lượng còn lại dưới ngưỡng cảnh báo.'],['Tồn kho bình thường','342 sản phẩm','Số lượng còn lại trên ngưỡng cảnh báo.']];const selected=type.startsWith('stock:')?Number(type.split(':')[1]):null;return {title:selected===null?'Tình trạng tồn kho':rows[selected][0],body:selected===null?`<p class="detail-intro">Tình trạng tồn kho hiện tại của cửa hàng.</p><div class="detail-list">${rows.map((x,i)=>`<button class="detail-item" data-stockdetail="${i}"><strong>${x[0]}</strong><span>${x[1]} · ${x[2]}</span></button>`).join('')}</div>`:`<div class="detail-card"><h3>${rows[selected][0]}</h3><p class="detail-intro">${rows[selected][2]}</p><div class="detail-grid"><span>Số sản phẩm</span><strong>${rows[selected][1]}</strong><span>Cập nhật</span><strong>Theo tồn kho hiện tại</strong></div></div><button class="drawer-action" data-open="stock">${icon('left')} Xem mọi tình trạng</button>`}};
    if(type==='debt'||type==='debtInfo')return {title:type==='debt'?'Công nợ khách hàng':'Cách tính công nợ',body:card('users','Tổng công nợ',`<div class="detail-grid"><span>Dư nợ hiện tại</span><strong>${money(1250000*factor())}</strong><span>Khách còn nợ</span><strong>5</strong><span>Khách quá hạn</span><strong>2</strong></div>`)+card('info','Phạm vi','<p>Đây là số dư công nợ khách hàng tại thời điểm xem. Giao dịch bán trả sau làm tăng công nợ; các khoản thu làm giảm công nợ.</p>','blue')};
    const info={invoices:['Số hóa đơn','Đếm các hóa đơn bán hàng đã hoàn tất trong thời gian đã chọn.',num(t.invoices)],units:['Số sản phẩm bán','Tổng số lượng sản phẩm trên các hóa đơn bán hàng đã hoàn tất.',num(t.units)],profit:['Lợi nhuận ước tính','Doanh thu trừ giá vốn ước tính của số hàng đã bán. Con số demo có thể khác lợi nhuận sau chi phí.',money(t.profit)],hourInfo:['Doanh thu theo giờ','Mỗi cột gom các giao dịch hoàn tất trong một giờ. Có thể chuyển sang số hóa đơn hoặc số sản phẩm.',money(t.revenue)],structureInfo:['Cơ cấu doanh thu','Tỷ trọng doanh thu theo nhóm sản phẩm. Chọn một nhóm ở chú giải để xem giá trị tương ứng.',money(t.revenue)],bestInfo:['Sản phẩm bán chạy','Xếp hạng theo số lượng bán trong thời gian đã chọn.',num(t.units)]}[type];
    if(info)return {title:info[0],body:card('info','Cách hiểu',`<p>${info[1]}</p>`,'blue')+card('chart','Giá trị đang hiển thị',`<p><strong>${info[2]}</strong> · ${formatDate(dateObj())}</p>`)};
    return {title:'Tổng quan',body:card('info','Bản tham chiếu tương tác','<p>Màn này mô phỏng điều hướng trong SimpleStore. Các module khác được thiết kế thành mini-project riêng.</p>','blue')};
  }
  function openDrawer(type,focus=true){state.drawer=type;const d=detailsFor(type);$('#drawerTitle').textContent=d.title;$('#drawerContent').innerHTML=d.body;$('#app').classList.add('drawer-open');$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('show');if(focus)$('#closeDrawer').focus()}
  function closeDrawer(){state.drawer=null;$('#app').classList.remove('drawer-open');$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('show')}
  let toastTimer;function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2800)}
  function moveDay(delta){const d=dateObj();d.setDate(d.getDate()+delta);state.date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;state.category=null;render()}
  document.addEventListener('click',e=>{const target=e.target.closest('[data-open],[data-nav],[data-product],[data-tx],[data-stock],[data-category],[data-hour],[data-txdetail],[data-productdetail],[data-stockdetail]');if(!target)return;
    if(target.dataset.open){openDrawer(target.dataset.open);return}
    if(target.dataset.nav){$('#sidebar').classList.remove('mobile-open');if(target.dataset.nav==='Tổng quan'){closeDrawer();window.scrollTo({top:0,behavior:'smooth'})}else openDrawer('module');return}
    if(target.dataset.product!==undefined||target.dataset.productdetail!==undefined){openDrawer(`product:${target.dataset.product??target.dataset.productdetail}`);return}
    if(target.dataset.tx!==undefined||target.dataset.txdetail!==undefined){openDrawer(`transaction:${target.dataset.tx??target.dataset.txdetail}`);return}
    if(target.dataset.stock!==undefined||target.dataset.stockdetail!==undefined){openDrawer(`stock:${target.dataset.stock??target.dataset.stockdetail}`);return}
    if(target.dataset.category!==undefined){state.category=state.category===target.dataset.category?null:target.dataset.category;renderDonut();return}
    if(target.dataset.hour!==undefined){state.selectedBar=state.selectedBar===Number(target.dataset.hour)?null:Number(target.dataset.hour);renderChart();return}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('#sidebar').classList.remove('mobile-open')}if(e.key==='F12'){e.preventDefault();openDrawer('module')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open][role="button"]')){e.preventDefault();openDrawer(e.target.dataset.open)}});
  $('#prevDay').addEventListener('click',()=>moveDay(-1));$('#nextDay').addEventListener('click',()=>moveDay(1));$('#dateButton').addEventListener('click',()=>{const input=$('#dateInput');if(input.showPicker)input.showPicker();else input.click()});$('#dateInput').addEventListener('change',e=>{if(e.target.value){state.date=e.target.value;state.category=null;render()}});
  $('#shiftSelect').addEventListener('change',e=>{state.shift=e.target.value;state.category=null;state.selectedBar=null;render()});$('#chartMetric').addEventListener('change',e=>{state.metric=e.target.value;state.selectedBar=null;renderChart()});$('#storeStatus').addEventListener('click',()=>{state.closed=!state.closed;renderHeader();toast(state.closed?'Đã chuyển trạng thái cửa hàng sang đóng cửa.':'Cửa hàng đang mở cửa.')});$('#saleButton').addEventListener('click',()=>openDrawer('module'));$('#storePicker').addEventListener('click',()=>toast('Đang xem Cửa hàng Tạp Hóa Việt Anh.'));$('#userMenu').addEventListener('click',()=>toast('Tài khoản demo: Việt Anh.'));$('#collapse').addEventListener('click',()=>{$('#sidebar').classList.toggle('mobile-open');toast('Sử dụng menu bên trái để xem các mục.');});$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('mobile-open'));$('#closeDrawer').addEventListener('click',closeDrawer);$('#scrim').addEventListener('click',closeDrawer);
  render();if(new URLSearchParams(location.search).get('drawer')==='revenue')openDrawer('revenue',false);
})();
</script>
</body>
</html>
